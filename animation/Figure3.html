<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure 3</title>
<style>
  body { margin: 0; background: transparent; font-family: "Fira Sans", sans-serif; color: #2E1A12; }
  .conteneur-animation { padding: 16px; }
  .ligne-donnees { display: grid; grid-template-columns: 140px 1fr 80px; gap: 10px; align-items: center; margin: 10px 0; }
  .nom-aliment { font-weight: 700; text-align: right; }
  .piste-graphique { background: #fff; height: 26px; border: 0; }
  .barre-graphique { height: 100%; width: 0; background: #C47A1A; transition: width 1.2s ease; }
  .animation-lancee .barre-graphique { width: var(--w); }
  .valeur { font-weight: 700; color: #C47A1A; }
</style>
</head>
<body>
<div class="conteneur-animation" id="anim">
  <div class="ligne-donnees"><span class="nom-aliment">Green veg</span><div class="piste-graphique"><div class="barre-graphique" style="--w:100%"></div></div><span class="valeur">26.2 pts</span></div>
  <div class="ligne-donnees"><span class="nom-aliment">Other fresh veg</span><div class="piste-graphique"><div class="barre-graphique" style="--w:65%"></div></div><span class="valeur">17.0 pts</span></div>
  <div class="ligne-donnees"><span class="nom-aliment">Cheese</span><div class="piste-graphique"><div class="barre-graphique" style="--w:45%"></div></div><span class="valeur">11.7 pts</span></div>
  <div class="ligne-donnees"><span class="nom-aliment">Confectionery</span><div class="piste-graphique"><div class="barre-graphique" style="--w:32%"></div></div><span class="valeur">8.5 pts</span></div>
  <div class="ligne-donnees"><span class="nom-aliment">Other cereals</span><div class="piste-graphique"><div class="barre-graphique" style="--w:24%"></div></div><span class="valeur">6.4 pts</span></div>
</div>
<script>
  const conteneur-animation = document.getElementById("anim");
  function lancer() { conteneur-animation.classList.remove("animation-lancee"); setTimeout(() => conteneur-animation.classList.add("animation-lancee"), 100); }
  lancer();
</script>
</body>
</html>
